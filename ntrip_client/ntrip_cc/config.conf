# ============================================================
# NTRIP Bridge configuration
# Deploy: sudo cp config.conf /etc/ntrip-bridge/config.conf
#         sudo chmod 600 /etc/ntrip-bridge/config.conf
#         sudo chown root:root /etc/ntrip-bridge/config.conf
# ============================================================

ntrip_host=172.20.10.3
ntrip_port=2101
ntrip_mountpoint=BASE
ntrip_user=huy
ntrip_password=123456
ntrip_use_tls=false

# RTCM filter: comma-separated message IDs. Empty = forward all.
# Common set for RTK:  1005,1074,1084,1094,1124,1230
rtcm_whitelist=

# ---------- MAVLink link to PX4 ----------
# type: "serial" (UART/USB) or "udp"
mavlink_type=serial
mavlink_serial_device=/dev/ttyAMA4
mavlink_serial_baud=115200

# UDP (only used if mavlink_type=udp)
mavlink_udp_host=127.0.0.1
mavlink_udp_port=14550

# ---------- MAVLink identity ----------
mavlink_sysid=255
mavlink_compid=190
target_sysid=1
target_compid=1

# ---------- Fallback GGA position ----------
#fixed_lat=21.028511
#fixed_lon=105.804817
#fixed_alt=10.0
